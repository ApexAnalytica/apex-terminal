name: Feedback → PR

on:
  issues:
    types: [labeled]

jobs:
  claude-implement:
    if: github.event.label.name == 'feedback-approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: feedback-approved
          branch_prefix: "feedback/"
          claude_args: "--allowed-tools Bash,Read,Write,Edit,Grep,Glob"
          prompt: |
            A user-submitted feedback item has been approved for implementation.
            The full request (including Feedback-ID trailer and any admin notes)
            is in the body of this issue (#${{ github.event.issue.number }}).

            Implement the requested change and open a pull request. The PR
            description MUST include the line:

                Feedback-ID: <uuid from issue body>

            exactly as it appears in the issue. The production pipeline uses
            this trailer to link the merged PR back to the originating
            feedback row — without it, the row will never flip to "shipped".

            Keep the change minimal and focused on what was asked. Do not bundle
            unrelated refactors.
